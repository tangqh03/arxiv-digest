[project]
name = "arxiv-digest"
version = "0.1.0"
description = "Personalized Hugging Face Daily Papers digest"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1,<2",
    "httpx[socks]>=0.28,<1",
    "pypdf>=5,<7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["arxiv_digest"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: opt-in tests that access real external services",
]
