name: daily paper digest

on:
  schedule:
    # GitHub Actions cron uses UTC. 02:00 UTC = 10:00 UTC+8.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_papers:
        description: Maximum HF papers for this manual run
        required: true
        default: "5"
      deep_top_k:
        description: Maximum full-paper deep summaries for this manual run
        required: true
        default: "1"
      deliver:
        description: Send the manual run to the production Feishu bot
        required: true
        type: boolean
        default: false
      force_delivery:
        description: Resend even when the same digest was already delivered
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Singapore
      SCREENING_LLM_BASE_URL: ${{ secrets.SCREENING_LLM_BASE_URL }}
      SCREENING_LLM_API_KEY: ${{ secrets.SCREENING_LLM_API_KEY }}
      SCREENING_LLM_MODEL: ${{ secrets.SCREENING_LLM_MODEL }}
      DEEP_LLM_BASE_URL: ${{ secrets.DEEP_LLM_BASE_URL }}
      DEEP_LLM_API_KEY: ${{ secrets.DEEP_LLM_API_KEY }}
      DEEP_LLM_MODEL: ${{ secrets.DEEP_LLM_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install runtime dependencies
        run: uv sync --frozen --no-dev

      - name: Resolve digest date
        id: digest-date
        run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore caches and delivery receipts
        uses: actions/cache@v6
        with:
          path: |
            memory/analysis
            memory/deep_summaries
            memory/fulltext
            memory/delivery
          key: daily-state-${{ steps.digest-date.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            daily-state-${{ steps.digest-date.outputs.value }}-
            daily-state-

      - name: Generate and deliver scheduled digest
        if: github.event_name == 'schedule'
        run: >-
          uv run --no-sync python scripts/run_daily.py
          --date today
          --max-papers 50
          --deep-top-k 3
          --deliver feishu

      - name: Run manual digest
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_DELIVER: ${{ inputs.deliver }}
          MANUAL_FORCE_DELIVERY: ${{ inputs.force_delivery }}
          MANUAL_MAX_PAPERS: ${{ inputs.max_papers }}
          MANUAL_DEEP_TOP_K: ${{ inputs.deep_top_k }}
        run: |
          args=(
            --date today
            --max-papers "$MANUAL_MAX_PAPERS"
            --deep-top-k "$MANUAL_DEEP_TOP_K"
            --deliver feishu
          )
          if [[ "$MANUAL_DELIVER" != "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$MANUAL_FORCE_DELIVERY" == "true" ]]; then
            args+=(--force-delivery)
          fi
          uv run --no-sync python scripts/run_daily.py "${args[@]}"

      - name: Upload digest and run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-digest-${{ steps.digest-date.outputs.value }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            memory/digests/${{ steps.digest-date.outputs.value }}.md
            memory/runs/${{ steps.digest-date.outputs.value }}/run.json
